<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pgtiler — Local Preview</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@4/dist/pmtiles.js"></script>
    <script src="config.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }

        #sidebar {
            width: 240px;
            background: #16213e;
            color: #e0e0e0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        #sidebar h1 { font-size: 15px; font-weight: 700; color: #7ec8e3; letter-spacing: 1px; }
        #sidebar h2 { font-size: 10px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 14px; }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
            padding: 3px 0;
        }
        .radio-option input[type="radio"] { cursor: pointer; accent-color: #7ec8e3; }

        #links { margin-top: auto; padding-top: 12px; border-top: 1px solid #2a2a4a; }
        #links a { color: #7ec8e3; font-size: 11px; display: block; margin-bottom: 4px; }

        #map { flex: 1; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h1>pgtiler</h1>

        <h2>Maps</h2>
        <label class="radio-option">
            <input type="radio" name="maps" value="none">
            None
        </label>
        <label class="radio-option">
            <input type="radio" name="maps" value="street" checked>
            Street (OpenFreeMap)
        </label>
        <label class="radio-option">
            <input type="radio" name="maps" value="satellite">
            Satellite (ESRI)
        </label>
        <label class="radio-option">
            <input type="radio" name="maps" value="topo">
            Topo (OpenTopoMap)
        </label>
        <label class="radio-option">
            <input type="radio" name="maps" value="squiggly-base">
            squiggly.v1.base
        </label>
        <label class="radio-option">
            <input type="radio" name="maps" value="squiggly-base-test">
            squiggly.v1.base-test
        </label>
        <div id="r2-maps"></div>

        <h2>Contours</h2>
        <label class="radio-option">
            <input type="radio" name="contours" value="none" checked>
            None
        </label>
        <label class="radio-option">
            <input type="radio" name="contours" value="local">
            squiggly.v1.contours
        </label>
        <label class="radio-option">
            <input type="radio" name="contours" value="local-test">
            squiggly.v1.contours-test
        </label>
        <div id="r2-contours"></div>

        <h2>Hillshade</h2>
        <label class="radio-option">
            <input type="radio" name="hillshade" value="none" checked>
            None
        </label>
        <label class="radio-option">
            <input type="radio" name="hillshade" value="local">
            squiggly.v1.hillshade
        </label>
        <label class="radio-option">
            <input type="radio" name="hillshade" value="local-test">
            squiggly.v1.hillshade-test
        </label>
        <label class="radio-option">
            <input type="radio" name="hillshade" value="esri">
            Hillshade (ESRI)
        </label>
        <div id="r2-hillshade"></div>

        <h2>Terrain</h2>
        <label class="radio-option">
            <input type="radio" name="terrain" value="none" checked>
            None
        </label>
        <label class="radio-option">
            <input type="radio" name="terrain" value="local">
            squiggly.v1.terrain
        </label>
        <label class="radio-option">
            <input type="radio" name="terrain" value="local-test">
            squiggly.v1.terrain-test
        </label>
        <div id="r2-terrain"></div>

        <div id="links">
            <a href="http://localhost:3000/catalog" target="_blank">Tile catalog</a>
        </div>
    </div>

    <div id="map"></div>

    <script>
        const MARTIN = 'http://localhost:3000';
        const R2_URL = (window.PGTILER_CONFIG && window.PGTILER_CONFIG.R2_PUBLIC_URL) || '';

        if (R2_URL) {
            const pmtilesProtocol = new pmtiles.Protocol();
            maplibregl.addProtocol('pmtiles', pmtilesProtocol.tile);
        }

        const GLYPHS_URL = 'https://fonts.openmaptiles.org/{fontstack}/{range}.pbf';

        // ── Basemap styles ──────────────────────────────────────────────────
        const BASEMAPS = {
            none: { version: 8, glyphs: GLYPHS_URL, sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#e0e0e0' } }] },
            street: 'https://tiles.openfreemap.org/styles/liberty',
            satellite: {
                version: 8,
                glyphs: GLYPHS_URL,
                sources: {
                    'esri-satellite': {
                        type: 'raster',
                        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                        tileSize: 256,
                        attribution: '© Esri, Maxar, Earthstar Geographics',
                        maxzoom: 19,
                    },
                },
                layers: [{ id: 'esri-satellite', type: 'raster', source: 'esri-satellite' }],
            },
            topo: {
                version: 8,
                glyphs: GLYPHS_URL,
                sources: {
                    'opentopomap': {
                        type: 'raster',
                        tiles: ['https://tile.opentopomap.org/{z}/{x}/{y}.png'],
                        tileSize: 256,
                        attribution: '© OpenTopoMap (CC-BY-SA)',
                        maxzoom: 17,
                    },
                },
                layers: [{ id: 'opentopomap', type: 'raster', source: 'opentopomap' }],
            },
        };

        // ── Active selections ───────────────────────────────────────────────
        const active = {
            contours: 'none',
            hillshade: 'none',
            terrain: 'none',
        };

        // ── Map init ────────────────────────────────────────────────────────
        const map = new maplibregl.Map({
            container: 'map',
            style: BASEMAPS.street,
            center: [150.62, -33.9],
            zoom: 9,
            maxPitch: 85,
            hash: true,
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');

        // ── Squiggly outdoor style builder ──────────────────────────────────
        function buildOutdoorStyle(src) {
            const s = (layer) => ({ source: src, 'source-layer': layer });
            const name = ['coalesce', ['get', 'name:en'], ['get', 'name']];

            return [
                { id: 'bg', type: 'background', paint: { 'background-color': '#e8e0cf' } },

                // Landcover
                { id: 'landcover-grass', type: 'fill', ...s('landcover'),
                  filter: ['==', 'class', 'grass'],
                  paint: { 'fill-color': '#dbe5c7', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 3, 0.2, 10, 0.38, 14, 0.5] } },
                { id: 'landcover-wood', type: 'fill', ...s('landcover'),
                  filter: ['==', 'class', 'wood'],
                  paint: { 'fill-color': '#ccd9b5', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 3, 0.2, 10, 0.38, 14, 0.5] } },
                { id: 'landcover-sand', type: 'fill', ...s('landcover'),
                  filter: ['in', 'class', 'sand', 'rock', 'ice'],
                  paint: { 'fill-color': '#ead9b5', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 3, 0.2, 10, 0.38, 14, 0.5] } },
                { id: 'landcover-other', type: 'fill', ...s('landcover'),
                  filter: ['!in', 'class', 'grass', 'wood', 'sand', 'rock', 'ice'],
                  paint: { 'fill-color': '#e3dccd', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 3, 0.2, 10, 0.38, 14, 0.5] } },

                // Landuse
                { id: 'landuse-residential', type: 'fill', ...s('landuse'),
                  filter: ['==', 'class', 'residential'],
                  paint: { 'fill-color': '#e8dfcf', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 5, 0.05, 10, 0.18, 14, 0.26] } },
                { id: 'landuse-commercial', type: 'fill', ...s('landuse'),
                  filter: ['in', 'class', 'commercial', 'industrial', 'retail'],
                  paint: { 'fill-color': '#ddd1bc', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 5, 0.05, 10, 0.18, 14, 0.26] } },
                { id: 'landuse-cemetery', type: 'fill', ...s('landuse'),
                  filter: ['==', 'class', 'cemetery'],
                  paint: { 'fill-color': '#e2d7c7', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 5, 0.05, 10, 0.18, 14, 0.26] } },
                { id: 'landuse-hospital', type: 'fill', ...s('landuse'),
                  filter: ['==', 'class', 'hospital'],
                  paint: { 'fill-color': '#e2d7c7', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 5, 0.05, 10, 0.18, 14, 0.26] } },
                { id: 'landuse-school', type: 'fill', ...s('landuse'),
                  filter: ['in', 'class', 'school', 'university'],
                  paint: { 'fill-color': '#e2d7c7', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 5, 0.05, 10, 0.18, 14, 0.26] } },

                // Park
                { id: 'park-fill', type: 'fill', ...s('park'),
                  paint: { 'fill-color': '#cfe0bb', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 4, 0.18, 10, 0.28, 14, 0.34] } },
                { id: 'park-outline', type: 'line', ...s('park'),
                  minzoom: 9,
                  paint: { 'line-color': '#a8c48a', 'line-width': 1, 'line-dasharray': [4, 2] } },

                // Water
                { id: 'water-fill', type: 'fill', ...s('water'),
                  paint: { 'fill-color': '#8eaec4', 'fill-opacity': 0.92 } },
                { id: 'waterway-river', type: 'line', ...s('waterway'),
                  filter: ['==', 'class', 'river'],
                  paint: { 'line-color': '#6f98b1', 'line-opacity': 0.9, 'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.6, 10, 1.4, 14, 3.5] } },
                { id: 'waterway-stream', type: 'line', ...s('waterway'),
                  filter: ['!=', 'class', 'river'],
                  minzoom: 10,
                  paint: { 'line-color': '#6f98b1', 'line-opacity': 0.9, 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 0.5, 14, 1.5] } },

                // Aeroway
                { id: 'aeroway-area', type: 'fill', ...s('aeroway'),
                  filter: ['==', '$type', 'Polygon'],
                  paint: { 'fill-color': '#ddd', 'fill-opacity': 0.6 } },
                { id: 'aeroway-line', type: 'line', ...s('aeroway'),
                  filter: ['==', '$type', 'LineString'],
                  paint: { 'line-color': '#ccc', 'line-width': ['match', ['get', 'class'], 'runway', 4, 'taxiway', 2, 1] } },

                // Boundary
                { id: 'boundary-country', type: 'line', ...s('boundary'),
                  filter: ['==', 'admin_level', 2],
                  paint: { 'line-color': '#9d8f7b', 'line-opacity': ['interpolate', ['linear'], ['zoom'], 2, 0.12, 6, 0.26, 12, 0.38], 'line-width': ['interpolate', ['linear'], ['zoom'], 2, 0.3, 6, 0.7, 12, 1.3], 'line-dasharray': [4, 3] } },
                { id: 'boundary-state', type: 'line', ...s('boundary'),
                  filter: ['==', 'admin_level', 4],
                  minzoom: 4,
                  paint: { 'line-color': '#9d8f7b', 'line-opacity': ['interpolate', ['linear'], ['zoom'], 4, 0.1, 8, 0.2, 12, 0.3], 'line-width': 0.8, 'line-dasharray': [4, 3] } },

                // Building
                { id: 'building-fill', type: 'fill', ...s('building'),
                  minzoom: 12.5,
                  paint: { 'fill-color': '#d1c3ad', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 12.5, 0.12, 14, 0.34] } },
                { id: 'building-outline', type: 'line', ...s('building'),
                  minzoom: 14,
                  paint: { 'line-color': '#c4b69e', 'line-width': 0.5 } },

                // Roads — casing
                { id: 'road-motorway-casing', type: 'line', ...s('transportation'),
                  filter: ['==', 'class', 'motorway'], minzoom: 5,
                  layout: { 'line-cap': 'round', 'line-join': 'round' },
                  paint: { 'line-color': '#f8f2e7', 'line-opacity': 0.92, 'line-width': ['interpolate', ['linear'], ['zoom'], 5, 2.2, 10, 4.2, 14, 10.5, 18, 20] } },
                { id: 'road-trunk-casing', type: 'line', ...s('transportation'),
                  filter: ['==', 'class', 'trunk'], minzoom: 6,
                  layout: { 'line-cap': 'round', 'line-join': 'round' },
                  paint: { 'line-color': '#f8f2e7', 'line-opacity': 0.92, 'line-width': ['interpolate', ['linear'], ['zoom'], 6, 2, 10, 4, 14, 10, 18, 18] } },
                { id: 'road-primary-casing', type: 'line', ...s('transportation'),
                  filter: ['==', 'class', 'primary'], minzoom: 7,
                  layout: { 'line-cap': 'round', 'line-join': 'round' },
                  paint: { 'line-color': '#f8f2e7', 'line-opacity': 0.92, 'line-width': ['interpolate', ['linear'], ['zoom'], 7, 1.8, 10, 3.6, 14, 9, 18, 16] } },
                { id: 'road-secondary-casing', type: 'line', ...s('transportation'),
                  filter: ['==', 'class', 'secondary'], minzoom: 9,
                  layout: { 'line-cap': 'round', 'line-join': 'round' },
                  paint: { 'line-color': '#f8f2e7', 'line-opacity': 0.92, 'line-width': ['interpolate', ['linear'], ['zoom'], 9, 1.5, 14, 7, 18, 14] } },
                { id: 'road-tertiary-casing', type: 'line', ...s('transportation'),
                  filter: ['in', 'class', 'tertiary', 'minor'], minzoom: 11,
                  layout: { 'line-cap': 'round', 'line-join': 'round' },
                  paint: { 'line-color': '#f7f1e5', 'line-opacity': 0.9, 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 1.2, 14, 5.4, 18, 12] } },

                // Roads — fill
                { id: 'road-motorway', type: 'line', ...s('transportation'),
                  filter: ['==', 'class', 'motorway'], minzoom: 5,
                  layout: { 'line-cap': 'round', 'line-join': 'round' },
                  paint: { 'line-color': '#c98f50', 'line-opacity': 0.94, 'line-width': ['interpolate', ['linear'], ['zoom'], 5, 1.1, 10, 2.3, 14, 7.2, 18, 16] } },
                { id: 'road-trunk', type: 'line', ...s('transportation'),
                  filter: ['==', 'class', 'trunk'], minzoom: 6,
                  layout: { 'line-cap': 'round', 'line-join': 'round' },
                  paint: { 'line-color': '#c98f50', 'line-opacity': 0.94, 'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.8, 10, 2, 14, 6.5, 18, 14] } },
                { id: 'road-primary', type: 'line', ...s('transportation'),
                  filter: ['==', 'class', 'primary'], minzoom: 7,
                  layout: { 'line-cap': 'round', 'line-join': 'round' },
                  paint: { 'line-color': '#d5aa68', 'line-opacity': 0.94, 'line-width': ['interpolate', ['linear'], ['zoom'], 7, 0.6, 10, 1.8, 14, 5.5, 18, 12] } },
                { id: 'road-secondary', type: 'line', ...s('transportation'),
                  filter: ['==', 'class', 'secondary'], minzoom: 9,
                  layout: { 'line-cap': 'round', 'line-join': 'round' },
                  paint: { 'line-color': '#dcc389', 'line-opacity': 0.94, 'line-width': ['interpolate', ['linear'], ['zoom'], 9, 0.5, 14, 3.5, 18, 10] } },
                { id: 'road-tertiary', type: 'line', ...s('transportation'),
                  filter: ['in', 'class', 'tertiary', 'minor'], minzoom: 11,
                  layout: { 'line-cap': 'round', 'line-join': 'round' },
                  paint: { 'line-color': '#c9b49a', 'line-opacity': 0.92, 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 0.7, 14, 3.4, 18, 8] } },
                { id: 'road-service', type: 'line', ...s('transportation'),
                  filter: ['==', 'class', 'service'], minzoom: 13,
                  layout: { 'line-cap': 'round', 'line-join': 'round' },
                  paint: { 'line-color': '#c9b49a', 'line-opacity': 0.92, 'line-width': ['interpolate', ['linear'], ['zoom'], 13, 0.5, 18, 4] } },
                { id: 'road-path', type: 'line', ...s('transportation'),
                  filter: ['in', 'class', 'path', 'track'], minzoom: 12,
                  layout: { 'line-cap': 'round', 'line-join': 'round' },
                  paint: { 'line-color': '#8e6b49', 'line-opacity': 0.78, 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 0.5, 14, 2], 'line-dasharray': [2, 1.5] } },
                { id: 'road-rail', type: 'line', ...s('transportation'),
                  filter: ['==', 'class', 'rail'], minzoom: 10,
                  paint: { 'line-color': '#b8b8b8', 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 0.8, 14, 1.5] } },
                { id: 'road-rail-dash', type: 'line', ...s('transportation'),
                  filter: ['==', 'class', 'rail'], minzoom: 10,
                  paint: { 'line-color': '#fff', 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 0.5, 14, 1], 'line-dasharray': [3, 3] } },

                // Labels — water
                { id: 'water-name-ocean', type: 'symbol', ...s('water_name'),
                  filter: ['==', '$type', 'Point'],
                  layout: { 'text-field': name, 'text-size': ['interpolate', ['linear'], ['zoom'], 2, 12, 8, 16],
                    'text-font': ['Open Sans Italic'], 'text-max-width': 8 },
                  paint: { 'text-color': '#4f7592', 'text-halo-color': '#e9e4d7', 'text-halo-width': 1.5 } },
                { id: 'water-name-line', type: 'symbol', ...s('water_name'),
                  filter: ['==', '$type', 'LineString'],
                  layout: { 'text-field': name, 'text-size': 11, 'text-font': ['Open Sans Italic'],
                    'symbol-placement': 'line', 'text-rotation-alignment': 'map' },
                  paint: { 'text-color': '#4f7592', 'text-halo-color': '#e9e4d7', 'text-halo-width': 1 } },

                // Labels — roads
                { id: 'road-label-primary', type: 'symbol', ...s('transportation_name'),
                  filter: ['in', 'class', 'motorway', 'trunk', 'primary'], minzoom: 9,
                  layout: { 'text-field': name, 'text-size': ['interpolate', ['linear'], ['zoom'], 9, 10, 12, 11, 14, 13],
                    'text-font': ['Open Sans Regular'], 'symbol-placement': 'line', 'text-rotation-alignment': 'map', 'text-max-angle': 45, 'text-letter-spacing': 0.02 },
                  paint: { 'text-color': '#715f4c', 'text-halo-color': '#f4efe7', 'text-halo-width': 1.1 } },
                { id: 'road-label-secondary', type: 'symbol', ...s('transportation_name'),
                  filter: ['!in', 'class', 'motorway', 'trunk', 'primary'], minzoom: 13,
                  layout: { 'text-field': name, 'text-size': 10, 'text-font': ['Open Sans Regular'],
                    'symbol-placement': 'line', 'text-rotation-alignment': 'map', 'text-max-angle': 45, 'text-letter-spacing': 0.02 },
                  paint: { 'text-color': '#715f4c', 'text-halo-color': '#f4efe7', 'text-halo-width': 1.1 } },

                // Mountain peaks
                { id: 'mountain-peak-point', type: 'circle', ...s('mountain_peak'),
                  filter: ['<=', ['get', 'rank'], ['step', ['zoom'], 1, 10, 3, 12, 5]],
                  minzoom: 9,
                  paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 9, 2, 14, 4],
                    'circle-color': 'rgba(105, 105, 95, 1)', 'circle-stroke-width': 1, 'circle-stroke-color': '#fff' } },
                { id: 'mountain-peak-label', type: 'symbol', ...s('mountain_peak'),
                  filter: ['<=', ['get', 'rank'], ['step', ['zoom'], 1, 10, 3, 12, 5]],
                  minzoom: 10,
                  layout: { 'text-field': ['concat', name, ['case', ['has', 'ele'], ['concat', '\n', ['to-string', ['get', 'ele']], ' m'], '']],
                    'text-size': ['interpolate', ['linear'], ['zoom'], 8, 10, 12, 12, 14, 13], 'text-font': ['Open Sans Bold'], 'text-offset': [0, 1.2], 'text-anchor': 'top' },
                  paint: { 'text-color': '#6a4b2d', 'text-halo-color': '#efe9de', 'text-halo-width': 1 } },

                // POI
                { id: 'poi-label', type: 'symbol', ...s('poi'),
                  minzoom: 14,
                  layout: { 'text-field': name, 'text-size': 10, 'text-font': ['Open Sans Regular'],
                    'text-offset': [0, 0.8], 'text-anchor': 'top', 'text-optional': true },
                  paint: { 'text-color': '#5d5245', 'text-halo-color': '#f3eee6', 'text-halo-width': 1 } },

                // Aerodrome labels
                { id: 'aerodrome-label', type: 'symbol', ...s('aerodrome_label'),
                  minzoom: 9,
                  layout: { 'text-field': name, 'text-size': ['interpolate', ['linear'], ['zoom'], 9, 10, 14, 12],
                    'text-font': ['Open Sans Bold'], 'text-letter-spacing': 0.08,
                    'text-offset': [0, 0.8], 'text-anchor': 'top' },
                  paint: { 'text-color': '#4d5965', 'text-halo-color': '#f1eee8', 'text-halo-width': 1 } },

                // House numbers
                { id: 'housenumber-label', type: 'symbol', ...s('housenumber'),
                  minzoom: 17,
                  layout: { 'text-field': ['get', 'housenumber'], 'text-size': 9, 'text-font': ['Open Sans Regular'] },
                  paint: { 'text-color': '#8a7e6f', 'text-halo-color': '#f3eee6', 'text-halo-width': 0.8 } },

                // Place labels
                { id: 'place-country', type: 'symbol', ...s('place'),
                  filter: ['==', 'class', 'country'], maxzoom: 8,
                  layout: { 'text-field': name, 'text-size': ['interpolate', ['linear'], ['zoom'], 3, 13, 7, 17, 14, 20],
                    'text-font': ['Open Sans Bold'], 'text-transform': 'uppercase', 'text-letter-spacing': 0.06, 'text-max-width': 6 },
                  paint: { 'text-color': '#3c332a', 'text-halo-color': '#f3eee6', 'text-halo-width': 1.4 } },
                { id: 'place-state', type: 'symbol', ...s('place'),
                  filter: ['==', 'class', 'state'], minzoom: 4, maxzoom: 10,
                  layout: { 'text-field': name, 'text-size': ['interpolate', ['linear'], ['zoom'], 3, 11, 7, 14, 14, 18],
                    'text-font': ['Open Sans Bold'], 'text-transform': 'uppercase', 'text-letter-spacing': 0.06, 'text-max-width': 8 },
                  paint: { 'text-color': '#3c332a', 'text-halo-color': '#f3eee6', 'text-halo-width': 1.4 } },
                { id: 'place-city', type: 'symbol', ...s('place'),
                  filter: ['==', 'class', 'city'], minzoom: 4,
                  layout: { 'text-field': name, 'text-size': ['interpolate', ['linear'], ['zoom'], 3, 0, 7, 13, 14, 17],
                    'text-font': ['Open Sans Bold'], 'text-max-width': 8 },
                  paint: { 'text-color': '#3c332a', 'text-halo-color': '#f3eee6', 'text-halo-width': 1.4 } },
                { id: 'place-town', type: 'symbol', ...s('place'),
                  filter: ['==', 'class', 'town'], minzoom: 7,
                  layout: { 'text-field': name, 'text-size': ['interpolate', ['linear'], ['zoom'], 7, 11, 14, 14],
                    'text-font': ['Open Sans Bold'], 'text-max-width': 8 },
                  paint: { 'text-color': '#3c332a', 'text-halo-color': '#f3eee6', 'text-halo-width': 1.4 } },
                { id: 'place-village', type: 'symbol', ...s('place'),
                  filter: ['==', 'class', 'village'], minzoom: 9,
                  layout: { 'text-field': name, 'text-size': ['interpolate', ['linear'], ['zoom'], 9, 10, 14, 13],
                    'text-font': ['Open Sans Regular'], 'text-max-width': 8 },
                  paint: { 'text-color': '#5d5245', 'text-halo-color': '#f3eee6', 'text-halo-width': 1 } },
                { id: 'place-hamlet', type: 'symbol', ...s('place'),
                  filter: ['in', 'class', 'hamlet', 'suburb', 'neighbourhood', 'isolated_dwelling'], minzoom: 12,
                  layout: { 'text-field': name, 'text-size': 11, 'text-font': ['Open Sans Regular'], 'text-max-width': 8 },
                  paint: { 'text-color': '#5d5245', 'text-halo-color': '#f3eee6', 'text-halo-width': 1 } },

                // Park labels
                { id: 'park-label', type: 'symbol', ...s('park'),
                  filter: ['==', '$type', 'Point'], minzoom: 9,
                  layout: { 'text-field': name, 'text-size': ['interpolate', ['linear'], ['zoom'], 9, 10, 13, 12], 'text-font': ['Open Sans Regular'], 'text-max-width': 8 },
                  paint: { 'text-color': '#58714c', 'text-halo-color': '#eef0e7', 'text-halo-width': 0.9 } },
            ];
        }

        // ── Squiggly basemap styles (built statically) ──────────────────────
        function buildSquigglyStyle(tileSourceId) {
            return {
                version: 8,
                glyphs: GLYPHS_URL,
                sources: { [tileSourceId]: { type: 'vector', url: `${MARTIN}/${tileSourceId}` } },
                layers: buildOutdoorStyle(tileSourceId),
            };
        }

        BASEMAPS['squiggly-base'] = buildSquigglyStyle('squiggly.v1.base');
        BASEMAPS['squiggly-base-test'] = buildSquigglyStyle('squiggly.v1.base-test');

        // ── DEM source configs ──────────────────────────────────────────────
        const TERRAIN_DEM_OPTS = {
            type: 'raster-dem',
            tiles: [`${MARTIN}/squiggly.v1.terrain/{z}/{x}/{y}`],
            encoding: 'terrarium',
            tileSize: 512,
            maxzoom: 12,
            bounds: [146, -37, 155, -27],
        };

        const TEST_TERRAIN_DEM_OPTS = {
            type: 'raster-dem',
            tiles: [`${MARTIN}/squiggly.v1.terrain-test/{z}/{x}/{y}`],
            encoding: 'terrarium',
            tileSize: 512,
            maxzoom: 12,
            bounds: [146, -37, 147, -36],
        };

        const R2_TERRAIN_DEM_OPTS = R2_URL ? {
            type: 'raster-dem',
            url: `pmtiles://${R2_URL}/squiggly.v1.terrain.pmtiles`,
            encoding: 'terrarium',
            tileSize: 512,
        } : null;

        // ── Contours layer management ───────────────────────────────────────
        const CONTOUR_LAYERS = {
            local: { sourceId: 'contours', sourceOpts: { type: 'vector', url: `${MARTIN}/squiggly.v1.contours` } },
            'local-test': { sourceId: 'contours-test', sourceOpts: { type: 'vector', url: `${MARTIN}/squiggly.v1.contours-test` } },
        };
        if (R2_URL) {
            CONTOUR_LAYERS.r2 = { sourceId: 'r2-contours', sourceOpts: { type: 'vector', url: `pmtiles://${R2_URL}/squiggly.v1.contours.pmtiles` } };
        }

        function contourLayerIds(sourceId) {
            return [`${sourceId}-line`, `${sourceId}-label`];
        }

        function addContourLayers(sourceId, sourceOpts) {
            if (!map.getSource(sourceId)) {
                map.addSource(sourceId, sourceOpts);
            }
            if (!map.getLayer(`${sourceId}-line`)) {
                map.addLayer({
                    id: `${sourceId}-line`,
                    type: 'line',
                    source: sourceId,
                    'source-layer': 'contours',
                    paint: {
                        'line-color': '#b5651d',
                        'line-opacity': ['interpolate', ['linear'], ['zoom'], 7, 0, 9, 0.1, 13, 0.6],
                        'line-width': ['case', ['==', ['%', ['get', 'elevation'], 100], 0], 1.2, 0.5],
                    },
                });
            }
            if (!map.getLayer(`${sourceId}-label`)) {
                map.addLayer({
                    id: `${sourceId}-label`,
                    type: 'symbol',
                    source: sourceId,
                    'source-layer': 'contours',
                    filter: ['==', ['%', ['get', 'elevation'], 100], 0],
                    minzoom: 12,
                    layout: {
                        'text-field': ['concat', ['to-string', ['get', 'elevation']], ' m'],
                        'text-size': 12,
                        'text-font': ['Open Sans Regular'],
                        'symbol-placement': 'line',
                        'text-rotation-alignment': 'map',
                        'text-max-angle': 30,
                    },
                    paint: {
                        'text-color': '#8B5A2B',
                        'text-halo-color': 'rgba(255,255,255,0.8)',
                        'text-halo-width': 2,
                    },
                });
            }
        }

        function setContourVisibility(sourceId, visible) {
            const vis = visible ? 'visible' : 'none';
            for (const layerId of contourLayerIds(sourceId)) {
                if (map.getLayer(layerId)) {
                    map.setLayoutProperty(layerId, 'visibility', vis);
                }
            }
        }

        function applyContours(value) {
            // Hide all contour layers
            for (const cfg of Object.values(CONTOUR_LAYERS)) {
                setContourVisibility(cfg.sourceId, false);
            }
            active.contours = value;
            if (value !== 'none' && CONTOUR_LAYERS[value]) {
                const cfg = CONTOUR_LAYERS[value];
                addContourLayers(cfg.sourceId, cfg.sourceOpts);
                setContourVisibility(cfg.sourceId, true);
            }
        }

        // ── Hillshade layer management ──────────────────────────────────────
        const HILLSHADE_LAYERS = {
            local: { sourceId: 'terrain-hillshade', sourceOpts: TERRAIN_DEM_OPTS, layerId: 'local-hillshade', type: 'hillshade' },
            'local-test': { sourceId: 'terrain-test-hillshade', sourceOpts: TEST_TERRAIN_DEM_OPTS, layerId: 'test-hillshade', type: 'hillshade' },
            esri: {
                sourceId: 'esri-hillshade',
                sourceOpts: {
                    type: 'raster',
                    tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}'],
                    tileSize: 256,
                    attribution: '© Esri, USGS, NOAA',
                    maxzoom: 16,
                },
                layerId: 'esri-hillshade-layer',
                type: 'raster',
            },
        };
        if (R2_TERRAIN_DEM_OPTS) {
            HILLSHADE_LAYERS.r2 = { sourceId: 'r2-terrain-hillshade', sourceOpts: R2_TERRAIN_DEM_OPTS, layerId: 'r2-hillshade', type: 'hillshade' };
        }

        function insertionPoint() {
            return map.getStyle().layers.find(l => l.type !== 'background' && l.type !== 'raster' && l.type !== 'hillshade')?.id;
        }

        function addHillshadeLayer(cfg) {
            if (!map.getSource(cfg.sourceId)) {
                map.addSource(cfg.sourceId, cfg.sourceOpts);
            }
            if (!map.getLayer(cfg.layerId)) {
                if (cfg.type === 'hillshade') {
                    map.addLayer({
                        id: cfg.layerId,
                        type: 'hillshade',
                        source: cfg.sourceId,
                        paint: {
                            'hillshade-exaggeration': 0.5,
                            'hillshade-shadow-color': '#473B24',
                            'hillshade-highlight-color': '#f6f0df',
                            'hillshade-accent-color': '#8f7a57',
                            'hillshade-illumination-direction': 315,
                        },
                    }, insertionPoint());
                } else {
                    map.addLayer({
                        id: cfg.layerId,
                        type: 'raster',
                        source: cfg.sourceId,
                        paint: { 'raster-opacity': 0.4, 'raster-resampling': 'linear' },
                    }, insertionPoint());
                }
            }
        }

        function applyHillshade(value) {
            // Hide all hillshade layers
            for (const cfg of Object.values(HILLSHADE_LAYERS)) {
                if (map.getLayer(cfg.layerId)) {
                    map.setLayoutProperty(cfg.layerId, 'visibility', 'none');
                }
            }
            active.hillshade = value;
            if (value !== 'none' && HILLSHADE_LAYERS[value]) {
                const cfg = HILLSHADE_LAYERS[value];
                addHillshadeLayer(cfg);
                map.setLayoutProperty(cfg.layerId, 'visibility', 'visible');
            }
        }

        // ── Terrain (3D) management ─────────────────────────────────────────
        const TERRAIN_SOURCES = {
            local: { sourceId: 'terrain-3d', sourceOpts: TERRAIN_DEM_OPTS },
            'local-test': { sourceId: 'terrain-test-3d', sourceOpts: TEST_TERRAIN_DEM_OPTS },
        };
        if (R2_TERRAIN_DEM_OPTS) {
            TERRAIN_SOURCES.r2 = { sourceId: 'r2-terrain-3d', sourceOpts: R2_TERRAIN_DEM_OPTS };
        }

        function applyTerrain(value) {
            active.terrain = value;
            if (value === 'none') {
                map.setTerrain(null);
                return;
            }
            const cfg = TERRAIN_SOURCES[value];
            if (!cfg) return;
            if (!map.getSource(cfg.sourceId)) {
                map.addSource(cfg.sourceId, cfg.sourceOpts);
            }
            map.setTerrain({ source: cfg.sourceId, exaggeration: 1.5 });
        }

        // ── Re-add overlays after style switch ──────────────────────────────
        function addOverlays() {
            if (active.hillshade !== 'none') applyHillshade(active.hillshade);
            if (active.contours !== 'none') applyContours(active.contours);
            if (active.terrain !== 'none') applyTerrain(active.terrain);
        }

        map.on('style.load', addOverlays);

        // ── Maps radio handler ──────────────────────────────────────────────
        document.querySelectorAll('input[name="maps"]').forEach(radio => {
            radio.addEventListener('change', e => {
                map.setStyle(BASEMAPS[e.target.value]);
            });
        });

        // ── Contours radio handler ──────────────────────────────────────────
        document.querySelectorAll('input[name="contours"]').forEach(radio => {
            radio.addEventListener('change', e => applyContours(e.target.value));
        });

        // ── Hillshade radio handler ─────────────────────────────────────────
        document.querySelectorAll('input[name="hillshade"]').forEach(radio => {
            radio.addEventListener('change', e => applyHillshade(e.target.value));
        });

        // ── Terrain radio handler ───────────────────────────────────────────
        document.querySelectorAll('input[name="terrain"]').forEach(radio => {
            radio.addEventListener('change', e => applyTerrain(e.target.value));
        });

        // ── R2 dynamic options ──────────────────────────────────────────────
        if (R2_URL) {
            // R2 basemap
            function addR2Radio(container, groupName, value, label) {
                const el = document.createElement('label');
                el.className = 'radio-option';
                el.innerHTML = `<input type="radio" name="${groupName}" value="${value}"> ${label}`;
                el.querySelector('input').addEventListener('change', e => {
                    if (groupName === 'maps') map.setStyle(BASEMAPS[e.target.value]);
                    else if (groupName === 'contours') applyContours(e.target.value);
                    else if (groupName === 'hillshade') applyHillshade(e.target.value);
                    else if (groupName === 'terrain') applyTerrain(e.target.value);
                });
                container.appendChild(el);
            }

            // R2 basemap style
            const r2BaseSourceId = 'squiggly-v1-base-r2';
            BASEMAPS['r2-base'] = {
                version: 8,
                glyphs: GLYPHS_URL,
                sources: { [r2BaseSourceId]: { type: 'vector', url: `pmtiles://${R2_URL}/squiggly.v1.base.pmtiles` } },
                layers: buildOutdoorStyle(r2BaseSourceId),
            };

            addR2Radio(document.getElementById('r2-maps'), 'maps', 'r2-base', 'squiggly.v1.base (R2)');
            addR2Radio(document.getElementById('r2-contours'), 'contours', 'r2', 'squiggly.v1.contours (R2)');
            addR2Radio(document.getElementById('r2-hillshade'), 'hillshade', 'r2', 'squiggly.v1.hillshade (R2)');
            addR2Radio(document.getElementById('r2-terrain'), 'terrain', 'r2', 'squiggly.v1.terrain (R2)');
        }
    </script>
</body>
</html>
